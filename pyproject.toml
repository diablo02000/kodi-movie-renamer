[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kodi-movie-renamer"
version = "0.1.0"
description = "CLI tool to rename movie files for Kodi video library using TheMovieDB or TheTVDB"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Christophe", email = "user@example.com" }
]
keywords = ["kodi", "movie", "renamer", "themoviedb", "thetvdb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]

dependencies = [
    "click>=8.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "tomli>=2.0.0",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
kodi-movie-renamer = "kodi_movie_renamer.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
python_files = "test_*.py"
testpaths = ["tests"]
